name: Daily Neural Symbolic Alpha

on:
  schedule:
    - cron: '0 23 * * 1-5'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Julia
        uses: julia-actions/setup-julia@v1
        with:
          version: '1.9'
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Pre‑install PySR (downloads Julia packages)
        run: python -c "from pysr import PySRRegressor; PySRRegressor()"
      - name: Run symbolic regression
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python trainer.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: symbolic-alpha-results
          path: results/
